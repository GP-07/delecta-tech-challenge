[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "delectatech-pipeline"
version = "0.1.0"
description = "End-to-end pipeline for restaurant and menu data."
requires-python = ">=3.12"
dependencies = [
    "httpx==0.28.1",
    "pydantic==2.14.1",
    "tenacity==9.2.1",
    "Django==5.2.18",
    "django-environ==0.14.0",
    "psycopg[binary]==3.3.6",
    "celery[redis]==5.6.3",
    "redis==6.4.0",
    "rapidfuzz==3.14.6",
    "openpyxl==3.1.5",
    "fastembed==0.9.1",
    "numpy==2.5.4",
    "djangorestframework==3.18.3",
    "whitenoise==6.12.0",
]

[project.optional-dependencies]
dev = [
    "pytest==9.1.1",
    "pytest-asyncio==1.4.1",
    "pytest-bdd==9.0.0",
    "pytest-django==4.14.0",
    "respx==0.23.1",
    "ruff==0.17.2",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"libs.crawler" = ["data/*.json"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
bdd_features_base_dir = "tests/features"
DJANGO_SETTINGS_MODULE = "config.settings.test"

[tool.ruff]
line-length = 120
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "S", "SIM"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101", "S105", "S106"]  # assert; test-only passwords
"src/apps/*/migrations/**" = ["E501"]
