# Local development: database, broker, admin, worker and scheduler.
#   docker compose up --build
#   docker compose exec web python manage.py createsuperuser
#   docker compose exec web python manage.py start_pipeline --limit 10 --now
#   dashboard: http://localhost:8000/ (superusers, or users of the "Dashboard" group added in the admin)
# Passwords here are for local use only; production takes them from its own secret store.
# The input files are read from ./data (mounted read-only; not in the repository): google_venues.json and
# food_categories.xlsx.

x-app: &app
  build: .
  environment:
    DJANGO_SETTINGS_MODULE: config.settings.local
    DATABASE_URL: postgres://delectatech:delectatech@db:5432/delectatech
    CELERY_BROKER_URL: redis://:delectatech@redis:6379/0
    CACHE_URL: redis://:delectatech@redis:6379/1
    PIPELINE_OUTPUT_DIR: /app/output
    GOOGLE_VENUES_FILE: /data/google_venues.json
    FOOD_CATEGORIES_FILE: /data/food_categories.xlsx
  volumes:
    - ./output:/app/output
    - ./data:/data:ro
  depends_on:
    db:
      condition: service_healthy
    redis:
      condition: service_healthy

services:
  db:
    image: postgres:16
    environment:
      POSTGRES_DB: delectatech
      POSTGRES_USER: delectatech
      POSTGRES_PASSWORD: delectatech
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports:
      - "127.0.0.1:5433:5432"  # only reachable from this machine
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U delectatech"]
      interval: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    command: ["redis-server", "--requirepass", "delectatech"]
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "delectatech", "ping"]
      interval: 5s
      retries: 10

  web:
    <<: *app
    command: sh -c "python manage.py migrate && python manage.py runserver 0.0.0.0:8000"
    environment:
      DJANGO_SETTINGS_MODULE: config.settings.local
      DATABASE_URL: postgres://delectatech:delectatech@db:5432/delectatech
      CELERY_BROKER_URL: redis://:delectatech@redis:6379/0
      CACHE_URL: redis://:delectatech@redis:6379/1
      PIPELINE_OUTPUT_DIR: /app/output
      GOOGLE_VENUES_FILE: /data/google_venues.json
      FOOD_CATEGORIES_FILE: /data/food_categories.xlsx
      DJANGO_ALLOWED_HOSTS: localhost,127.0.0.1,0.0.0.0
    ports:
      - "127.0.0.1:8000:8000"

  worker:
    <<: *app
    # Each step runs in a fresh process (CELERY_WORKER_MAX_TASKS_PER_CHILD=1). The memory cap keeps a runaway step
    # from taking the machine down: its process is killed, the step fails (fail_stalled_steps) and nothing is
    # published.
    command: celery -A config worker --loglevel=INFO --concurrency=2
    mem_limit: 6g

  beat:
    <<: *app
    command: celery -A config beat --loglevel=INFO --schedule /tmp/celerybeat-schedule
    volumes: []

volumes:
  pgdata:
